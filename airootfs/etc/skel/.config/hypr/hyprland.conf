# Monitör
monitor=,preferred,auto,1

# Otomatik Başlatma
exec-once = waybar
exec-once = hyprpaper
exec-once = dunst
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# Görsel Stil & Animasyonlar
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(c6a0f6ff) rgba(8aadf4ff) 45deg
    col.inactive_border = rgba(313244aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 6
        passes = 2
    }
    drop_shadow = true
    shadow_range = 15
    col.shadow = rgba(1a1a1aee)
}

animations {
    enabled = yes
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 6, myBezier
    animation = windowsOut, 1, 6, default, popin 80%
    animation = border, 1, 10, default
    animation = workspaces, 1, 5, default
}

# TUŞ ATAMALARI (Omarchy / Standart Hyprland Düzeni)
$mainMod = SUPER

# Temel ve Uygulama Kısayolları
bind = $mainMod, Q, exec, kitty                       # Terminal Aç
bind = $mainMod, C, killactive,                       # Pencereyi Kapat
bind = $mainMod, E, exec, dolphin                     # Dosya Yöneticisi
bind = $mainMod, B, exec, firefox                     # Tarayıcı
bind = $mainMod, SPACE, exec, rofi -show drun          # Uygulama Menüsü
bind = $mainMod, R, exec, rofi -show drun              # Alternatif Launcher
bind = $mainMod, V, togglefloating,                   # Yüzen Pencere Modu
bind = $mainMod, F, fullscreen,                       # Tam Ekran Modu

# Kapat / Aç / Sistem Menüsü (Power Menu)
bind = $mainMod SHIFT, Q, exec, ~/.config/hypr/scripts/powermenu.sh   # Güç Menüsü
bind = $mainMod SHIFT, R, exec, hyprctl reload && killall waybar && waybar # Barı/Sistemi Yenile

# Ses ve Ekran Parlaklığı Tuşları
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Pencere Odaklama (Yön Tuşları & WASD)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Çalışma Alanları (Workspaces 1-6)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

# Pencereyi Çalışma Alanına Taşıma
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4

# Fare ile Taşıma ve Boyutlandırma
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
